<script>
(() => {
// ---- Course data: 児玉カントリー倶楽部（GDO掲載のヤーデージ表）
// [par, HDCP, BACK, REG, FRONT, OB率%, バンカー率%]  OB率・バンカー率はGDOユーザー（スコア96〜105）の集計値。
// 対象（スコア80〜100）とずれるため%は表示せず、危険度ラベルの判定だけに使う。自分の実績が3回以上あればそちらを優先。
const C = {
  '西': [[5,2,546,535,523,0,14],[4,5,406,381,345,25,0],[3,8,201,174,130,13,25],[4,1,419,392,374,30,0],[4,4,380,359,330,18,9],[4,7,365,347,336,17,17],[5,3,534,488,476,0,0],[4,6,407,352,315,20,0],[3,9,145,134,124,0,0]],
  '南': [[4,8,353,324,324,0,0],[5,2,535,520,509,18,18],[4,4,377,349,336,29,0],[3,7,153,143,130,56,0],[4,5,395,369,347,0,29],[4,1,366,351,341,0,22],[4,6,349,340,293,13,13],[3,3,145,132,120,0,14],[5,9,489,472,459,0,0]],
  '東': [[4,8,317,300,300,0,0],[4,2,360,332,319,50,0],[4,5,325,315,300,75,0],[3,4,148,148,128,100,0],[5,1,456,440,419,67,0],[3,7,136,124,110,75,25],[5,3,510,486,452,57,0],[4,6,355,338,323,0,0],[4,9,350,350,335,0,20]]
};
const TEE = { back: ['バック', 2], reg: ['レギュラー', 3], front: ['フロント', 4] };
const TEESHOT = [['OB','OB'],['L','左'],['FW','FW'],['R','右'],['W','池']];
const KEY = 'kodama-onetap-v1';
const SAMPLE_VER = 2; // サンプルを入れ替えたら上げる（自分の記録は残す）
const OWN_MIN = 3; // 自分の実績に切り替える最低ラウンド数

// 自分の過去ラウンド（サンプル除く）から、そのホールの実績を集計
function own(course, no) {
  let n = 0, ob = 0, w = 0, fw = 0, par = 0;
  S.rounds.filter(r => !r.sample).forEach(r => r.holes.forEach((h, i) => {
    const f = info(r, i);
    if (f.course === course && f.no === no && h) { n++; par = f.par; if (h.t === 'OB') ob++; if (h.t === 'W') w++; if (h.t === 'FW') fw++; }
  }));
  return { n, ob, w, fw, par };
}
function riskHints(h) {
  const out = [];
  const o = own(h.course, h.no);
  if (o.n >= OWN_MIN) {
    out.push([o.ob + o.w >= Math.ceil(o.n / 3) ? 'warn' : '', `あなたのOB・池 ${o.ob + o.w}/${o.n}回`]);
    if (o.par >= 4) out.push(['', `FWキープ ${o.fw}/${o.n}回`]);
  } else {
    if (h.ob >= 40) out.push(['warn', 'OB多発']); else if (h.ob >= 20) out.push(['', 'OB注意']);
    if (h.bk >= 20) out.push(['', 'バンカー注意']);
  }
  return out;
}

// ティーショットのアイコン：左右は矢印、FWは◎、OBは白杭、池は池のイラスト
function teeIcon(k, s) {
  const lab = (TEESHOT.find(t => t[0] === k) || ['', ''])[1];
  const a = `width="${s}" height="${s}" viewBox="0 0 24 24" role="img" aria-label="${lab}"`;
  // 足元から上に伸び、途中から左（右）へ逸れていく弾道の矢印

function sum(a) { return a.reduce((x, y) => x + y, 0); }
function analyze(r) {
  const H = r.holes.map((h, i) => Object.assign({ i }, info(r, i), h));
  const total = sum(H.map(h => h.s)), par = sum(H.map(h => h.par));
  const out = sum(H.slice(0, 9).map(h => h.s)), inn = sum(H.slice(9).map(h => h.s));
  const putts = sum(H.map(h => h.p));
  const fwCh = H.filter(h => h.par >= 4), fwHit = fwCh.filter(h => h.t === 'FW').length;
  const gir = H.filter(h => h.s - h.p <= h.par - 2).length;
  const three = H.filter(h => h.p >= 3).length;
  const obN = H.filter(h => h.t === 'OB').length, wN = H.filter(h => h.t === 'W').length;
  const loss = { approach: 0, tee: 0, putt: 0, pen: 0 };
  H.forEach(h => {
    const d = h.s - h.par;
    const pen = h.t === 'OB' ? 2 : h.t === 'W' ? 1 : 0;
    const pl = Math.max(0, h.p - 2);
    loss.pen += Math.min(pen, Math.max(0, d));
    loss.putt += Math.min(pl, Math.max(0, d - pen));
    let rest = Math.max(0, d - pen - pl);
    const girH = h.s - h.p <= h.par - 2;
    if (h.par >= 4 && (h.t === 'L' || h.t === 'R') && !girH && rest > 0) { loss.tee += 1; rest -= 1; }
    loss.approach += rest;
    h.d = d; h.gir = girH;
  });
  const cnt = { e: 0, b: 0, p: 0, bo: 0, db: 0 };
  H.forEach(h => { if (h.d <= -2) cnt.e++; else if (h.d === -1) cnt.b++; else if (h.d === 0) cnt.p++; else if (h.d === 1) cnt.bo++; else cnt.db++; });
  return { H, total, par, diff: total - par, out, inn, putts, avgPutt: putts / 18, fwHit, fwCh: fwCh.length, gir, three, obN, wN, loss, cnt };
}

function review(r, a) {

  const L = H.filter(h => h.t === 'L').length, R = H.filter(h => h.t === 'R').length;

  const scramble = nonGir.filter(h => h.d <= 0).length;
  const bogeyOn = H.filter(h => h.bon).length;

  const byPar = [3, 4, 5].map(p => { const hs = H.filter(h => h.par === p); return { p, n: hs.length, avg: avg(hs.map(h => h.d)) }; });
  const hard = H.filter(h => h.hdcp <= 3), easy = H.filter(h => h.hdcp >= 7);

  if (bounceCh >= 2 && bounce / bounceCh < 0.5) flow.push(`ダボ以上の次のホールでパー以上は${bounceCh}回中${bounce}回。ミスを引きずりやすい傾向があります。ミスの後は、深呼吸してからティーに立つルーティンを決めておきましょう。`);
  if (r.wind === '強') flow.push('強風の中でのラウンドでした。この条件での数字は割り引いて見て大丈夫です。');
  if (r.weather === '雨') flow.push('雨の中でのラウンドでした。グリーンが重い日は、パットが短くなりやすいです。');

  // ホールの傾向
  const holeT = [];
  const worstPar = byPar.filter(x => x.n).sort((x, y) => y.avg - x.avg)[0];
  holeT.push(`パー3 平均${f1(byPar[0].avg)}・パー4 平均${f1(byPar[1].avg)}・パー5 平均${f1(byPar[2].avg)}。`);
  if (worstPar && worstPar.avg >= 1) holeT.push({ 3: 'パー3で一番苦戦しています。ティーショットがそのままグリーンを狙う1打なので、ショートしやすい人は1番手大きめを選びましょう。', 4: 'パー4で一番苦戦しています。2打目が長く残りやすいので、ボギーオン（3打でグリーン）を基準に組み立てるのが現実的です。', 5: 'パー5で一番苦戦しています。2打目で無理をせず、3打目を得意な距離から打てるように刻むのが近道です。' }[worstPar.p]);
  if (easy.length && hard.length) {
    if (easyAvg >= 1 && easyAvg >= hardAvg - 0.3) holeT.push(`易しいホール（HDCP7〜9）でも平均${f1(easyAvg)}。難ホールの平均${f1(hardAvg)}と差がありません。易しいホールの取りこぼしを減らすのが、一番効率よくスコアを縮める方法です。`);
    else holeT.push(`難ホール（HDCP1〜3）で平均${f1(hardAvg)}、易しいホール（HDCP7〜9）で平均${f1(easyAvg)}。難ホールはボギーで十分という意識で、大叩きを防ぎましょう。`);
  }

  // 次回の児玉CC攻略プラン（今日打数を落としたホール）
  const plan = H.slice().filter(h => h.d >= 2).sort((x, y) => (y.d - x.d) || (x.hdcp - y.hdcp)).slice(0, 3).map(h => {
    const o = own(h.course, h.no);
    let t = `今日は${sgn(h.d)}。`;
    if (h.t === 'OB' || h.t === 'W') t += `ティーショットが${h.t === 'OB' ? 'OB' : '池'}。次回はUTかFWウッドで、${h.t === 'OB' ? 'OB' : '池'}と反対サイドを狙いましょう。`;
    else if (h.t === 'L' || h.t === 'R') t += `ティーショットを${h.t === 'L' ? '左' : '右'}に外してから崩れました。次回は${h.t === 'L' ? '右' : '左'}サイドを狙い、2打目は確実に前へ。`;
    else if (h.p >= 3) t += `${h.p}パット。グリーンに乗ったら、まず2パットで上がることを優先。`;
    else t += `グリーンまで${h.toG}打かかりました。2打目以降は無理にピンを狙わず、グリーンの広い側へ。`;
    if (o.n >= OWN_MIN && o.ob + o.w >= 2) t += `（これまで${o.n}回中${o.ob + o.w}回OB・池）`;
    else if (o.n < OWN_MIN && h.ob >= 20) t += '（OBが出やすいホール）';
    if (h.hdcp <= 3) t += ` HDCP${h.hdcp}の難ホールなので、ボギーで上がれば十分です。`;
    if (h.par === 5) t += ' パー5は3打目勝負。2打目は得意な距離を残すことを優先。';
    return { title: `${hn(h)}（PAR${h.par}・${h.yd}y）`, t };
  });

  // 次回の目標
  const goals = [];
  if (top) goals.push(['スコア', `${a.total}`, `${a.total - Math.max(2, Math.min(5, Math.ceil(topV / 2)))}`]);
  keys.filter(k => a.loss[k] > 0).slice(0, 3).forEach(k => {
    if (k === 'approach') goals.push(bogeyOn < 13 ? ['ボギーオン', `${bogeyOn}/18`, `${Math.min(18, bogeyOn + 3)}/18`] : ['パーオン', `${a.gir}/18`, `${Math.min(18, a.gir + 2)}/18`]);
    if (k === 'tee') goals.push(['FWキープ', `${a.fwHit}/${a.fwCh}`, `${Math.min(a.fwCh, a.fwHit + 2)}/${a.fwCh}`]);
    const cap = t => t > 0 ? `${t}回以下` : '0回';
    if (k === 'putt') goals.push(['3パット', `${a.three}回`, cap(Math.max(0, Math.min(1, a.three - 1)))]);
    if (k === 'pen') goals.push(['OB・池', `${a.obN + a.wN}回`, cap(Math.max(0, a.obN + a.wN - 1))]);
  });

  // 練習メニュー（1位の課題を3つ、2位の課題から1つ）
  const menu = top ? ISSUE[top].menu.slice() : [];
  if (merged) { const o = top === 'tee' ? 'pen' : 'tee'; menu.push(`（${ISSUE[o].name}）${ISSUE[o].menu[0]}`); }
  if (top && second) menu.push(`（${ISSUE[second].name}）${ISSUE[second].menu[0]}`);

  // これまでとの比較
  const pool = S.rounds.filter(x => x.id !== r.id && x.date <= r.date && !!x.sample === !!r.sample).slice(-5);
  let comp = null;
  if (pool.length) {
    const P = pool.map(analyze);
    const pb = P.map(p => p.H.filter(h => h.s - h.p <= h.par - 1).length);
    const row = (label, now, before, lowerBetter, fmt) => ({ label, now: fmt(now), before: fmt(before), better: lowerBetter ? now < before - 0.05 : now > before + 0.05, worse: lowerBetter ? now > before + 0.05 : now < before - 0.05 });
    comp = { k: pool.length, rows: [
      row('スコア', a.total, avg(P.map(p => p.total)), true, v => v.toFixed(Number.isInteger(v) ? 0 : 1)),
      row('FWキープ', pctS(a.fwHit, a.fwCh), avg(P.map(p => pctS(p.fwHit, p.fwCh))), false, v => Math.round(v) + '%'),
      row('ボギーオン', bogeyOn, avg(pb), false, v => v.toFixed(Number.isInteger(v) ? 0 : 1)),
      row('パット', a.putts, avg(P.map(p => p.putts)), true, v => v.toFixed(Number.isInteger(v) ? 0 : 1)),
      row('OB・池', a.obN + a.wN, avg(P.map(p => p.obN + p.wN)), true, v => v.toFixed(Number.isInteger(v) ? 0 : 1))
    ] };
  }

  const issue = top ? Object.assign({ v: topV, pct: topPct }, ISSUE[top]) : null;
  if (issue && merged) { issue.title = 'ティーショットのミスを減らす'; issue.why = `左右への曲がり（${a.loss.tee}打）とOB・池（${a.loss.pen}打）を合わせると、ロスの一番大きな原因です。` + ISSUE[top].why; }
  const others = top ? keys.slice(1).filter(k => a.loss[k] > 0 && !(merged && (k === 'tee' || k === 'pen'))).map(k => ({ name: ISSUE[k].name, v: a.loss[k], pct: pct(k) })) : [];
  return { summary, good: good.slice(0, 3), issue, others, sections: [['ティーショット', tee], ['2打目〜グリーンまで', appr], ['パット', putt], ['流れ・メンタル', flow], ['ホールの傾向', holeT]], plan, goals, menu, comp };
}

function trendCard(desc) {
  const asc = desc.slice().reverse().slice(-10);
  if (asc.length < 2) return '';
  const vals = asc.map(r => analyze(r).total);
  const lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  const W = 320, Hh = 110, padL = 30, padR = 16, padT = 14, padB = 26;
  const x = i => padL + (W - padL - padR) * (asc.length === 1 ? 0.5 : i / (asc.length - 1));
  const y = v => padT + (Hh - padT - padB) * (v - lo) / (hi - lo);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const avg = (sum(vals) / vals.length).toFixed(1);
  const best = Math.min(...vals);
  const labels = asc.map((r, i) => `<text x="${x(i).toFixed(1)}" y="${Hh - 6}" font-size="10" text-anchor="middle">${md(r.date)}</text>`).join('');
  const last = vals.length - 1;
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2>スコア推移</h2><span class="muted small">平均 <b style="color:var(--fg)">${avg}</b> · ベスト <b style="color:var(--fg)">${best}</b></span></div>
    <div class="sc-wrap"><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="直近${vals.length}ラウンドのスコア推移">
      <line x1="${padL}" x2="${W - padR}" y1="${y(hi - 2).toFixed(1)}" y2="${y(hi - 2).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"></line>
      <line x1="${padL}" x2="${W - padR}" y1="${y(lo + 2).toFixed(1)}" y2="${y(lo + 2).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"></line>
      <text x="${padL - 6}" y="${(y(hi - 2) + 4).toFixed(1)}" font-size="10" text-anchor="end">${hi - 2}</text>
      <text x="${padL - 6}" y="${(y(lo + 2) + 4).toFixed(1)}" font-size="10" text-anchor="end">${lo + 2}</text>
      <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
      ${vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === last ? 5 : 3}" fill="${i === last ? 'var(--accent)' : 'var(--green)'}"></circle>`).join('')}
      <text x="${x(last).toFixed(1)}" y="${(y(vals[last]) - 9).toFixed(1)}" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--fg)">${vals[last]}</text>
      ${labels}
    </svg></div><p class="muted small">上がスコアが悪く、下が良い方向です。</p></div>`;
}

// ここまで入力したホールから、今日の傾向とプレー中のひと言を出す
function todayCard(r) {
  const H = [];
  r.holes.forEach((h, i) => { if (h) H.push(Object.assign({}, info(r, i), h)); });
  const n = H.length;
  if (!n) return `<div class="today"><div class="today-h"><h2>今日の傾向</h2></div><p class="muted small">1ホール記録すると、ここに今日の傾向が出ます。</p></div>`;
  const ch = H.filter(h => h.par >= 4);
  const c = k => ch.filter(h => h.t === k).length;
  const fw = c('FW'), L = c('L'), R = c('R'), ob = c('OB'), w = c('W');
  const gir = H.filter(h => h.s - h.p <= h.par - 2).length;
  const putts = sum(H.map(h => h.p)), three = H.filter(h => h.p >= 3).length;
  const pen = ob * 2 + w;
  let appr = 0;
  H.forEach(h => { const d = h.s - h.par, pp = h.t === 'OB' ? 2 : h.t === 'W' ? 1 : 0;
    let rest = Math.max(0, d - pp - Math.max(0, h.p - 2));
    if (h.par >= 4 && (h.t === 'L' || h.t === 'R') && h.s - h.p > h.par - 2 && rest > 0) rest--;
    appr += rest; });
  const tips = [];
  if (n >= 3) {
    if (L >= 2 && L > R) tips.push(`左へのミスが${L}回。次のティーショットはフェアウェイの右サイドを狙いましょう。`);
    else if (R >= 2 && R > L) tips.push(`右へのミスが${R}回。次のティーショットはフェアウェイの左サイドを狙いましょう。`);
    if (ob + w >= 2) tips.push(`OB・池が${ob + w}回。危ないホールは番手を落として、まず前に運ぶことを優先。`);
    if (three >= 2) tips.push(`3パットが${three}回。ロングパットはカップを狙わず、距離を合わせることだけに集中。`);
    if (appr >= 3 && appr >= pen && appr >= three) tips.push(`グリーン周りでここまで約${appr}打のロス。寄せは転がしで、まず確実に乗せましょう。`);
    if (!tips.length) tips.push('大きなミスの偏りはありません。このリズムのまま進みましょう。');
  }
  const cell = (k, v, hot) => `<div class="${hot ? 'hot' : ''}">${teeIcon(k, 18)}<b>${v}</b></div>`;
  const most = Math.max(L, R, ob, w);
  return `<section class="today" aria-label="今日の傾向">
    <div class="today-h"><h2>今日の傾向</h2><span class="muted small">ここまで${n}ホール</span></div>
    <div class="mini">
      <div><span>FWキープ</span><b>${fw}/${ch.length}</b></div>
      <div><span>パーオン</span><b>${gir}/${n}</b></div>
      <div><span>平均パット</span><b>${(putts / n).toFixed(1)}</b></div>
      <div><span>3パット</span><b>${three}</b></div>
    </div>
    ${ch.length ? `<div class="grp"><span class="label">ティーショットの行き先</span><div class="dir">
      ${cell('OB', ob, ob > 0 && ob === most)}${cell('L', L, L >= 2 && L === most)}${cell('FW', fw, false)}${cell('R', R, R >= 2 && R === most)}${cell('W', w, w > 0 && w === most)}
    </div></div>` : ''}
    ${n < 3 ? '<p class="muted small">3ホール記録すると、プレー中のアドバイスが出ます。</p>'
      : tips.slice(0, 1).map(t => `<p class="tip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"></path></svg><span>${t}</span></p>`).join('')}
  </section>`;
}

function vPlay() {
  const r = S.cur, i = S.hole, h = info(r, i), d = S.draft;
  const diff = d.s - h.par;
  const names = { '-3': 'アルバトロス', '-2': 'イーグル', '-1': 'バーディ', '0': 'パー', '1': 'ボギー', '2': 'ダブルボギー', '3': 'トリプルボギー' };
  const nm = names[String(diff)] || sgn(diff);
  const col = diff < 0 ? 'var(--good)' : diff === 0 ? 'var(--muted)' : 'var(--warn-fg)';
  let tot = 0, tp = 0, n = 0;
  r.holes.forEach((x, j) => { if (x) { tot += x.s; tp += info(r, j).par; n++; } });
  const hints = [];
  if (h.hdcp <= 2) hints.push(['warn', `HDCP${h.hdcp} 難ホール`]); else hints.push(['', `HDCP${h.hdcp}`]);
  riskHints(h).forEach(x => hints.push(x));
  const dots = r.holes.map((x, j) => `<button class="dot ${j === i ? 'here' : x ? 'done' : ''}" data-a="go" data-v="${j}" aria-label="${info(r, j).course}${info(r, j).no}番へ">${j + 1}</button>`).join('');
  const putts = [0, 1, 2, 3, 4].map(p => `<button class="chip ${d.p === p ? 'on' : ''}" data-a="putt" data-v="${p}">${p === 4 ? '4+' : p}</button>`).join('');
  const tees = TEESHOT.map(([k, l]) => `<button class="chip tee ${d.t === k ? 'on' : ''}" data-a="tee" data-v="${k}" aria-pressed="${d.t === k}">${teeIcon(k, 22)}<span aria-hidden="true">${l}</span></button>`).join('');
  const last = i === 17;
  return `<div class="screen"><div class="ph wrap">
      <div class="ph-top"><div class="hints">${hints.map(([c, t]) => `<span class="hint ${c}">${t}</span>`).join('')}</div><button data-a="home">中断</button></div>
      <div class="ph-hole"><div class="ph-left"><span class="ph-no">${h.course}${h.no}<small>番</small></span><span class="pill">PAR ${h.par}</span><span class="pill">${h.yd}y</span></div>
        <div class="ph-total"><span>${n}H 合計</span><div><b>${tot}</b><em>${n ? sgn(tot - tp) : '±0'}</em></div></div></div>
      <div class="dots">${dots}</div>
    </div>
    <div class="main wrap stack">
      ${S.msg ? `<div class="msg" role="status">${esc(S.msg)}</div>` : ''}
      <div class="grp"><span class="label">スコア</span>
        <div class="stepper"><button data-a="dec" aria-label="1打減らす">−</button>
          <div class="val"><b>${d.s}</b><span style="color:${col}">${nm}</span></div>
          <button class="plus" data-a="inc" aria-label="1打増やす">＋</button></div></div>
      <div class="grp"><span class="label">パット数</span><div class="chips c5">${putts}</div></div>
      ${h.par >= 4 ? `<div class="grp"><span class="label">ティーショット</span><div class="chips c5">${tees}</div></div>`
        : `<p class="auto">パー3はティーショット入力なし。パーオンで評価します。</p>`}
      ${todayCard(r)}
    </div>
    <div class="bar wrap"><div class="navrow">
      <button class="btn back" data-a="prev" aria-label="前のホールに戻る" ${i === 0 ? 'disabled' : ''}>◀</button>
      <button class="btn primary" data-a="next">${last ? '記録してラウンド終了' : '記録して次のホールへ →'}</button></div></div></div>`;
}

function mark(d, s) {
  const c = d <= -2 ? 'e' : d === -1 ? 'b' : d === 0 ? '' : d === 1 ? 'bo' : 'db';
  return `<span class="mk ${c}">${s}</span>`;
}

function vResult() {
  const r = S.rounds.find(x => x.id === S.viewId);
  if (!r) { S.view = 'home'; return vHome(); }
  const a = analyze(r);
  const half = (k) => { const hs = a.H.slice(k * 9, k * 9 + 9); const course = k ? r.in : r.out;
    return `<table class="sc"><thead><tr><th scope="col" style="text-align:left">${course}</th>${hs.map(h => `<th scope="col">${h.no}</th>`).join('')}<th scope="col">計</th></tr></thead><tbody>
      <tr><td class="rl">PAR</td>${hs.map(h => `<td class="muted">${h.par}</td>`).join('')}<td class="muted">36</td></tr>
      <tr><td class="rl">打数</td>${hs.map(h => `<td>${mark(h.d, h.s)}</td>`).join('')}<td><b>${sum(hs.map(h => h.s))}</b></td></tr>
      <tr><td class="rl">パット</td>${hs.map(h => `<td class="muted">${h.p}</td>`).join('')}<td class="muted">${sum(hs.map(h => h.p))}</td></tr>
      <tr><td class="rl">ティー</td>${hs.map(h => `<td class="${h.t === 'FW' ? '' : 'muted'}" style="${h.t === 'FW' ? 'color:var(--good)' : ''}">${h.t ? teeIcon(h.t, 16) : '<span class="muted small">–</span>'}</td>`).join('')}<td></td></tr>
    </tbody></table>`; };
  const L = a.loss, maxL = Math.max(1, ...Object.values(L));
  const lossRows = [['approach', 'アプローチ〜寄せ', 'var(--bar-dbl)'], ['tee', 'ティーショット（FWを外した）', 'var(--accent)'], ['putt', 'パット（3パット以上）', 'var(--bar-bogey)'], ['pen', 'OB・池', 'var(--bar-par)']]
    .map(([k, l, c]) => `<div class="loss-row"><div class="t"><span>${l}</span><span>+${L[k]}打</span></div><div class="track"><div class="fill" style="width:${Math.round(L[k] / maxL * 100)}%;background:${c}"></div></div></div>`).join('');

  const analysis = `
    <div class="tiles">
      <div class="tile"><span>FWキープ</span><b>${a.fwCh ? Math.round(a.fwHit / a.fwCh * 100) : 0}%</b><span>${a.fwHit}/${a.fwCh}</span></div>
      <div class="tile"><span>パーオン</span><b>${Math.round(a.gir / 18 * 100)}%</b><span>${a.gir}/18</span></div>
      <div class="tile"><span>平均パット</span><b>${a.avgPutt.toFixed(2)}</b><span>3パット ${a.three}</span></div>
      <div class="tile"><span>OB・池</span><b>${a.obN + a.wN}</b><span>+${a.obN * 2 + a.wN}打</span></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2>どこで打数を失ったか</h2><span class="muted small">パー比 ${sgn(a.diff)} の内訳（推定）</span></div>
      ${lossRows}
      <p class="muted small">スコア・パット・ティーショットの3項目から推定しています。</p></div>
    <div class="card"><h2>スコアカード</h2>
      <div class="sc-wrap">${half(0)}</div><div class="sc-wrap">${half(1)}</div>
      <div class="legend"><span><span class="mk b">.</span>バーディ</span><span><span class="mk">.</span>パー</span><span><span class="mk bo">.</span>ボギー</span><span><span class="mk db">.</span>ダブルボギー以上</span></div>
      <p class="muted small">バーディ${a.cnt.b + a.cnt.e} · パー${a.cnt.p} · ボギー${a.cnt.bo} · ダボ以上${a.cnt.db}</p></div>`;

  const reviewHtml = reviewView(r, a);

  return `<div class="main wrap stack">
    <div class="score-head"><div><span class="muted small">${md(r.date)} · 児玉CC ${r.out}→${r.in} · ${TEE[r.tee][0]} · ${r.weather}・風${r.wind}${r.sample ? `<span class="tag">サンプル${r.label ? '・' + r.label : ''}</span>` : ''}</span>
      <div><span class="big">${a.total}</span><span class="diff">${sgn(a.diff)}</span></div></div>
      <div class="small muted" style="text-align:right">OUT <b style="color:var(--fg);font-size:16px">${a.out}</b> / IN <b style="color:var(--fg);font-size:16px">${a.inn}</b><br>パット <b style="color:var(--fg);font-size:16px">${a.putts}</b></div></div>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="${S.tab === 'review'}" class="${S.tab === 'review' ? 'on' : ''}" data-a="tab" data-v="review">振り返り</button><button role="tab" aria-selected="${S.tab === 'analysis'}" class="${S.tab === 'analysis' ? 'on' : ''}" data-a="tab" data-v="analysis">データ分析</button></div>
    ${S.tab === 'review' ? reviewHtml : analysis}
    <textarea id="copytxt" readonly hidden></textarea>
  </div>
  <div class="bar wrap"><button class="btn green" data-a="copy">${S.copied ? 'コピーしました' : '結果をテキストでコピー'}</button><button class="linkbtn" data-a="home">ホームに戻る</button></div>`;
}

function shareText(r) {
  const a = analyze(r), rv = review(r, a);
  return [`【児玉CC ${r.out}→${r.in}】${md(r.date)} ${a.total}（${sgn(a.diff)}）`,
    `OUT ${a.out} / IN ${a.inn} · パット${a.putts}`,
    `FWキープ${a.fwCh ? Math.round(a.fwHit / a.fwCh * 100) : 0}% · パーオン${a.gir}/18 · OB・池${a.obN + a.wN}`,
    rv.issue ? `次回の課題：${rv.issue.title}` : ''].filter(Boolean).join('\n');
}

// ---- Actions
function draftFor(i) {
  if (S.drafts[i]) return Object.assign({}, S.drafts[i]);
  const x = S.cur.holes[i]; if (x) return Object.assign({}, x);
  const par = info(S.cur, i).par; return { s: par, p: 2, t: par === 3 ? null : 'FW' };
}
function act(a, v) {
  S.msg = ''; if (a !== 'del' && a !== 'discard') S.arm = null; if (a !== 'copy') S.copied = false;
  switch (a) {
    case 'new': S.view = 'setup'; break;
    case 'home': S.view = 'home'; break;
    case 'out': S.setup.out = v; if (S.setup.in === v) S.setup.in = ['西', '南', '東'].find(c => c !== v); break;
    case 'in': S.setup.in = v; break;
    case 'tee': if (S.view === 'play') S.draft.t = v; else S.setup.tee = v; break;
    case 'weather': S.setup.weather = v; break;
    case 'wind': S.setup.wind = v; break;
    case 'start': {
      const t = new Date(); const p = n => String(n).padStart(2, '0');
      S.cur = Object.assign({ id: Date.now(), date: `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`, holes: Array(18).fill(null) }, S.setup);
      S.drafts = {}; S.hole = 0; S.draft = draftFor(0); S.view = 'play'; save(); break; }
    case 'resume': { const f = S.cur.holes.findIndex(x => !x); S.hole = f < 0 ? 17 : f; S.draft = draftFor(S.hole); S.view = 'play'; break; }
    case 'discard': if (S.arm === 'cur') { S.cur = null; S.arm = null; save(); } else S.arm = 'cur'; break;
    case 'go': S.drafts[S.hole] = S.draft; S.hole = Number(v); S.draft = draftFor(S.hole); break;
    case 'prev': if (S.hole > 0) { S.drafts[S.hole] = S.draft; S.hole--; S.draft = draftFor(S.hole); } break;
    case 'inc': S.draft.s = Math.min(15, S.draft.s + 1); break;
    case 'dec': S.draft.s = Math.max(1, S.draft.s - 1); if (S.draft.p > S.draft.s) S.draft.p = S.draft.s; break;
    case 'putt': S.draft.p = Number(v); if (S.draft.p >= S.draft.s) S.draft.s = S.draft.p + 1; break;
    case 'next': {
      S.cur.holes[S.hole] = Object.assign({}, S.draft); delete S.drafts[S.hole]; save();
      const miss = S.cur.holes.findIndex(x => !x);
      if (S.hole < 17 && (miss < 0 || miss > S.hole)) { S.hole++; S.draft = draftFor(S.hole); }
      else if (miss >= 0) { S.hole = miss; S.draft = draftFor(miss); S.msg = `${info(S.cur, miss).course}${info(S.cur, miss).no}番（${miss + 1}H目）が未入力です。入力するとラウンドを終了できます。`; }
      else { const r = S.cur; delete r.arm; S.rounds.push(r); S.cur = null; S.viewId = r.id; S.tab = 'review'; S.view = 'result'; save(); }
      window.scrollTo(0, 0); break; }
    case 'open': S.viewId = Number(v); S.tab = 'review'; S.view = 'result'; window.scrollTo(0, 0); break;
    case 'del': { const id = Number(v); if (S.arm === id) { S.rounds = S.rounds.filter(x => x.id !== id); S.arm = null; save(); } else S.arm = id; break; }
    case 'tab': S.tab = v; break;
    case 'copy': {
      const r = S.rounds.find(x => x.id === S.viewId); const txt = shareText(r);
      const fallback = () => { const ta = document.getElementById('copytxt'); ta.hidden = false; ta.value = txt; ta.rows = 4; ta.style.width = '100%'; ta.select(); };
      try { navigator.clipboard.writeText(txt).then(() => { S.copied = true; render(); }, fallback); } catch (e) { fallback(); }
      return; }
  }
  render();
}

const app = document.getElementById('app');
function render() {
  app.innerHTML = S.view === 'setup' ? vSetup() : S.view === 'play' ? vPlay() : S.view === 'result' ? vResult() : vHome();
}
app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) act(b.dataset.a, b.dataset.v); });
load(); render();
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}</script>
</body></html>
