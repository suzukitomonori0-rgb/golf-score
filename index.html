<script>
// 新しい版が出ていたら自動で読み込み直す
const PAGE_VERSION="2026.11.10-2226";
(async()=>{try{
  const j=await (await fetch("review-version.json?t="+Date.now(),{cache:"no-store"})).json();
  if(!j.v||j.v===PAGE_VERSION)return;
  let t=null;try{t=sessionStorage.getItem("top-reload")}catch(e){}
  if(t===j.v)return;try{sessionStorage.setItem("top-reload",j.v)}catch(e){}
  await fetch(location.pathname,{cache:"reload"}).catch(()=>{});location.reload();
}catch(e){}})();
